<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tam Yağlı | Anılar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px auto;
            border: 3px solid #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        h1 {
            font-size: 26px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .info-box {
            background-color: #0f172a;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 15px;
            text-align: left;
        }

        .info-title {
            color: #3b82f6;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .activity-list {
            list-style: none;
        }

        .activity-list li {
            color: #cbd5e1;
            font-size: 14px;
            padding: 6px 0;
            border-bottom: 1px dashed #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .activity-list li:last-child {
            border-bottom: none;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Yüklediğin logo.jpg görseli burada çağırılıyor -->
        <img src="logo.jpg" alt="Tam Yağlılar" class="profile-img">
        
        <h1>Tam Yağlı</h1>
        <p class="subtitle">Buluşma & Aktivite Günlüğü</p>

        <!-- Son Buluşma Tarihi -->
        <div class="info-box">
            <div class="info-title">📅 Son Buluşma Tarihi</div>
            <div style="color: #f8fafc; font-weight: 600; font-size: 15px;">4 Eylül 2026</div>
        </div>

        <!-- Buluşmada Ne Yaptık -->
        <div class="info-box">
            <div class="info-title">📍 Buluşma Akışı</div>
            <ul class="activity-list">
                <li>🖥️ İnternet kafede 2 saat oyun</li>
                <li>🥙 Körfez Döner'de yemek</li>
                <li>🀄 Okey keyfi</li>
                <li>🥤 Burger King'den Milkshake</li>
            </ul>
        </div>

        <footer>
            © 2026 Tam Yağlı — Tüm hakları saklıdır.
        </footer>
    </div>

</body>
</html>
