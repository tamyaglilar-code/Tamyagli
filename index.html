<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilal Efe | Kişisel Web Sitesi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 40px;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        h1 {
            font-size: 26px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .bio {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
            background-color: #0f172a;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #1e293b;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: block;
            padding: 14px;
            background-color: #334155;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid #475569;
        }

        .link-btn:hover {
            background-color: #3b82f6;
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-img">BE</div>
        <h1>Bilal Efe</h1>
        <p class="subtitle">Kişisel Web Sayfası</p>
        
        <div class="bio">
            Hoş geldiniz! Bu benim GitHub Pages üzerinde yayınladığım kişisel web sitem. Yazılım, e-spor ve teknoloji projelerimi buradan paylaşacağım.
        </div>

        <div class="links">
            <a href="https://github.com/tamyaglilar-code" target="_blank" class="link-btn">GitHub Profilim</a>
            <a href="#" class="link-btn">Projelerim</a>
            <a href="#" class="link-btn">İletişime Geç</a>
        </div>

        <footer>
            © 2026 ig= b_efe4o — Tüm hakları saklıdır.
        </footer>
    </div>

</body>
</html>
